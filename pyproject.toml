[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-account-fraud-detection"
version = "0.1.0"
description = "Bank account opening fraud: time-based validation, cost-based decisions, fairness audit and drift"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Rodrigo Grandez"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
